name: Main Release

# Tests are not run here: a release tag points at a commit that already passed
# the full suite on its pull request to main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry

      # A tag that disagrees with pyproject.toml would publish a version nobody
      # can reproduce from the tag, so fail before anything is built.
      - name: Check tag matches project version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(poetry version --short)"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version '${tag}' but pyproject.toml says '${project}'"
            exit 1
          fi
          echo "tag and pyproject agree on ${project}"

      - name: Build
        run: poetry build

      - name: Check metadata
        run: |
          pipx install twine
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to ${{ github.event.inputs.target || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    # Environment name must match the one configured on the index's trusted
    # publisher, and is what any required-reviewer rule attaches to.
    environment: ${{ github.event.inputs.target || 'pypi' }}
    permissions:
      id-token: write # OIDC token for trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: >-
            ${{ github.event.inputs.target == 'testpypi'
                && 'https://test.pypi.org/legacy/'
                || 'https://upload.pypi.org/legacy/' }}
